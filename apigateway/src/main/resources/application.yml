server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: auth-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/auth/**

          - id: user-service
            uri: http://localhost:8082
            predicates:
              - Path=/api/profile/**

          - id: resume-service
            uri: http://localhost:8082
            predicates:
              - Path=/api/resumes/**

          - id: job-service
            uri: http://localhost:8083
            predicates:
              - Path=/api/jobs/**,/api/applications/**