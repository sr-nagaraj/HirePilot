<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HirePilot | AI Powered Hiring Platform</title>
    <meta
      name="description"
      content="HirePilot is an AI-powered recruitment platform that helps recruiters hire faster and enables candidates to discover better career opportunities."
    />
    <meta
      name="keywords"
      content="AI Hiring Platform, Recruitment Software, Job Portal, Candidate Screening, Resume Analysis, Hiring Automation"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1163ff" />
    <link rel="canonical" href="https://hirepilot.ai/" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HirePilot" />
    <meta property="og:title" content="HirePilot | AI Powered Hiring Platform" />
    <meta
      property="og:description"
      content="AI-powered recruitment software for candidate screening, resume analysis, job matching, and hiring automation."
    />
    <meta property="og:url" content="https://hirepilot.ai/" />
    <meta property="og:image" content="https://hirepilot.ai/assets/hirepilot-platform-preview.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HirePilot | AI Powered Hiring Platform" />
    <meta
      name="twitter:description"
      content="HirePilot helps recruiters hire faster and candidates discover smarter career opportunities."
    />
    <meta name="twitter:image" content="https://hirepilot.ai/assets/hirepilot-platform-preview.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "HirePilot",
            "url": "https://hirepilot.ai/",
            "logo": "https://hirepilot.ai/assets/hirepilot-logo.png"
          },
          {
            "@type": "WebSite",
            "name": "HirePilot",
            "url": "https://hirepilot.ai/",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://hirepilot.ai/candidate/dashboard/jobs?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "JobBoard",
            "name": "HirePilot",
            "url": "https://hirepilot.ai/"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
